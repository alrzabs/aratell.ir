<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8">
  <title>علیرضا عباسی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff4500">

  <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css"
    rel="stylesheet" type="text/css" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Vazir, sans-serif;
      background: #ffffff;
      text-align: center;
      padding: 50px 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #000000;
      margin-bottom: 36px;
    }

    section {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      text-align: right;
      background-color: #fff4e8;
      border-radius: 16px;
      padding: 16px;
      box-sizing: border-box;
    }

    section h2 {
      margin: 0 0 6px;
      text-align: right;
    }

    section ul {
      display: block;
      margin: 0;
      padding: 0;
      list-style-position: inside;
      text-align: right;
      line-height: 2;
      box-sizing: border-box;
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, #999, transparent);
      margin: 25px 0;
    }

    .button-with-icon {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 280px;
      width: 100%;
      background: #F2F2F2;
      color: black;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      margin: 15px auto;
      direction: rtl;
      text-align: right;
      transition: background 0.3s;
      box-sizing: border-box;
    }

    .button-with-icon:hover {
      background: #DBDBDB;
      color: black;
    }

    .button-with-icon img {
      width: 24px;
      height: 24px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 20px;
    }

    .social-icons a {
      color: #333;
      font-size: 32px;
      transition: transform 0.3s ease;
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (max-width: 600px) {
      .button-with-icon {
        font-size: 16px;
      }

      .social-icons a {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <h1 dir="rtl">آموزش بورس</h1>

  <section dir="rtl">
    <h2>پیش‌نیازها:</h2>
    <ul>
      <li>عضویت در کارگزاری مفید</li>
      <li>فعال‌سازی خرید عیار (طلا) به‌جای دریافت سود ریالی در مانده حساب (صندوق حامی)</li>
    </ul>
  </section>

  <br>

  <section dir="rtl">
    <h2>سرمایه‌گذاری‌های منظم:</h2>
    <ul>
      <li>روزانهٔ عیار (حداقل ۲۰۰ هزار تومان)</li>
      <li>روزانهٔ صندوق امید توسعه (حداقل ۲۰۰ هزار تومان)</li>
      <li>همهٔ عرضه‌های اولیه</li>
    </ul>
  </section>

  <hr />

  <a class="button-with-icon"
    href="https://nobitex.ir/signup/?refcode=332524"
    target="_blank"
    rel="noopener noreferrer">

    <img
      src="https://raw.githubusercontent.com/alrzabs/aratell.ir/refs/heads/main/Nobitex.png"
      alt="Nobitex Icon">

    <span>ثبت نام در صرافی نوبیتکس</span>
  </a>

  <footer>
    <div class="social-icons">

      <a href="https://instagram.com/mirzaalirezaabbasi"
        target="_blank"
        title="Instagram">
        <i class="fab fa-instagram" style="color:#e1306c;"></i>
      </a>

      <a href="https://t.me/CryptoMirypto"
        target="_blank"
        title="Telegram">
        <i class="fab fa-telegram" style="color:#0088cc;"></i>
      </a>

      <a href="https://youtube.com/@alrzabs"
        target="_blank"
        title="YouTube">
        <i class="fab fa-youtube" style="color:#ff0000;"></i>
      </a>

    </div>
  </footer>

</body>
</html>
